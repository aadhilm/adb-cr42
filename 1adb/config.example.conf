# CR42 ADB Toolkit — user config
# Copy to ~/.cr42-adb.conf and edit.

EXEC_MODE=sequential     # sequential | parallel (leave empty for auto)
COOLDOWN=15              # 0 = skip
WAIT_AFTER_TRIES=3
CHAIN_STEP_WAIT=10
KEYEVENT_SLEEP=1
NOTIFY=none              # none | desktop | telegram | both
TELEGRAM_TOKEN=
TELEGRAM_CHAT=
HARD_REFRESH=0
NO_BANNER=0
